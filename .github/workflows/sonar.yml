name: SonarQube Analysis

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - "*"

jobs:
  sonarqube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Deno Setup
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Collect Coverage
        run: |
          # 1. テスト実行
          deno task coverage
          
          # 2. 絶対パスを相対パスに置換
          deno coverage coverage_result --lcov | sed "s|SF:$GITHUB_WORKSPACE/|SF:|g" > lcov.info

          # 3. lcov.infoの内容を表示（デバッグ用）
          head -n 5 lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
